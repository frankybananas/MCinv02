name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Type check
        run: pnpm typecheck
        
      - name: Lint
        run: pnpm lint
        
      - name: Run tests
        run: pnpm test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-minimum-32-chars
          # Dummy encryption key for Facebook token encryption (64 hex chars)
          FACEBOOK_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build application
        run: pnpm build
        env:
          # Skip runtime env validation during build
          SKIP_ENV_VALIDATION: true
          # Provide dummy values for build-time checks
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: build-time-secret-not-used-at-runtime
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          # Dummy encryption key for Facebook token encryption (64 hex chars)
          FACEBOOK_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Trigger Coolify Deploy Webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::notice ::COOLIFY_WEBHOOK_URL secret is not set. Skipping Coolify deploy trigger."
            exit 0
          fi
          echo "Triggering deployment in Coolify..."
          response=$(curl -s -w "\n%{http_code}" -X GET "$COOLIFY_WEBHOOK_URL")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response body: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Coolify deployment successfully triggered (HTTP $http_code)."
          else
            echo "::error ::Coolify deployment webhook returned HTTP $http_code"
            exit 1
          fi

